# ============================================================
# pyproject.toml — project manifest (PEP 621)
# ============================================================
# This is THE single source of truth for the project's metadata,
# dependencies, and tooling configuration. Everything project-related
# lives here, including:
#   - what the package is called and what version it is
#   - what other packages it needs to run (and to develop)
#   - how to build it
#   - how linters/formatters/type-checkers should behave
# ============================================================

[project]
name = "lyra-lite"
version = "0.1.0"
description = "Permutation-invariant transformer for single-cell leukemia classification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Anthony Engelmann", email = "anthony.engelmann@hhu.de" },
]
license = { text = "MIT" }

# --- Runtime dependencies ---
# These are the packages the project NEEDS at runtime to function.
# Version specifiers use PEP 440 syntax:
#   ">=2.4,<3"  means "at least 2.4, less than 3.0" — accepts patch updates
# We prefer ranges (not exact pins here) so resolution can pick consistent
# versions; the LOCKFILE (uv.lock) pins exact versions for reproducibility.
dependencies = [
    "torch>=2.4,<3",                # neural network framework
    "numpy>=1.26,<3",               # numerical arrays
    "pandas>=2.2,<3",               # tabular data manipulation
    "scikit-learn>=1.4,<2",         # train/val/test splits, metrics, classical ML
    "hydra-core>=1.3,<2",           # config management
    "omegaconf>=2.3,<3",            # YAML config object underlying Hydra
    "tqdm>=4.66,<5",                # progress bars (cleaner than print loops)
    "entmax>=1.0",                  # entmax15 (sparse-attention option in the transformer)
]

[project.optional-dependencies]
# Development-only dependencies. Installed with `uv pip install -e ".[dev]"`.
# Kept separate from runtime deps so a production deployment doesn't pull in
# pytest, jupyter, etc.
dev = [
    "pytest>=8,<9",                 # test runner
    "pytest-cov>=5,<6",             # coverage reports for tests
    "ruff>=0.5,<1",                 # linter + formatter (fast, replaces black+flake8+isort)
    "mypy>=1.10,<2",                # static type checker
    "pre-commit>=3.7,<4",           # git hook framework for auto-formatting on commit
    "jupyter>=1.0",                 # notebook server for exploration
    "ipykernel>=6.29",              # Jupyter kernel for our venv
    "matplotlib>=3.9,<4",           # plotting
    "seaborn>=0.13,<1",             # nicer plots, statistical visualizations
]

# Single-cell / biology dependencies — added when we hook up real Caron 2020 data.
# Kept optional so the core project can run without them (e.g. on synthetic data).
bio = [
    "anndata>=0.10,<1",             # single-cell data structure (cell × gene matrix + metadata)
    "scanpy>=1.10,<2",              # single-cell analysis toolkit
    "h5py>=3.11",                   # underlying HDF5 reader for .h5ad files
]

# --- Build system ---
# Tells pip/uv how to build the package. setuptools is the standard.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# --- Package discovery ---
# Tells setuptools "look inside src/ for packages, find lyra_lite there."
# This is what makes the src/ layout work.
[tool.setuptools.packages.find]
where = ["src"]

# ============================================================
# Tool configuration sections
# ============================================================
# Each [tool.X] section configures a different tool. Putting them all in
# pyproject.toml keeps the project root clean (no .flake8, setup.cfg, etc).
# ============================================================

# --- ruff: linter + formatter ---
# Replaces black (formatting) + isort (import sorting) + flake8 (linting) in one fast tool.
[tool.ruff]
line-length = 100                   # black's default is 88, but 100 reads better on modern displays
target-version = "py311"

[tool.ruff.lint]
# Rule families to enable. See https://docs.astral.sh/ruff/rules/
# E,W = pycodestyle errors and warnings
# F   = pyflakes (unused imports, undefined names, etc)
# I   = isort (import order)
# N   = pep8-naming (PascalCase classes, snake_case functions, etc)
# UP  = pyupgrade (modernize syntax)
# B   = bugbear (likely-bug patterns)
# SIM = simplify (suggest cleaner equivalents)
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- pytest configuration ---
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "-v",                           # verbose
    "--strict-markers",             # error on unknown @pytest.mark.foo decorators
    "--tb=short",                   # short traceback format
]

# --- mypy: static type checking ---
# Type annotations are NOT enforced at runtime by Python. mypy reads them statically
# and tells you when types don't line up. Catches many bugs before they happen.
[tool.mypy]
python_version = "3.11"
strict = false                      # we'll start non-strict and tighten later
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true       # silence errors for libraries without type stubs (torch was historically weak)
