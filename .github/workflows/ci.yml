name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned Python
        run: uv python install         

      - name: Install dependencies (core + dev)
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest -q

      - name: Smoke-test the full pipeline on synthetic data (no download)
        run: bash scripts/demo.sh
